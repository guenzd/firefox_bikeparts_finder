<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teilefinder</title><link rel="stylesheet" href="home.css"><body><main><h1>Fahrradteile vergleichen</h1><form id="search"><label for="query">Produktname oder Artikelnummer</label><div class="search-box"><input id="query" placeholder="z. B. Shimano CN-M8100" maxlength="160" required><button id="search-submit">Suchen</button></div><div class="filter"><label for="search-ean">EAN</label><input id="search-ean" placeholder="Wird automatisch ergänzt" inputmode="numeric" pattern="[0-9]{8,14}" maxlength="14"></div><div class="filter"><label for="search-variant">Variante</label><input id="search-variant" placeholder="z. B. 30 mm, 750 ml oder silber" maxlength="100"></div><div class="filter"><label for="max">Maximalpreis (€)</label><input id="max" type="number" min="0" step="0.01" placeholder="Optional, z. B. 50"></div></form><button id="add-wish" class="secondary" type="button">Zur Wunschliste hinzufügen</button><section class="wishlist"><div class="shop-heading"><h2>Deine Wunschliste</h2><div class="wishlist-files"><button id="export-wishlist" type="button" class="secondary">Als Datei speichern</button><button id="import-wishlist" type="button" class="secondary">Datei laden</button><input id="wishlist-file" type="file" accept=".json,application/json" hidden></div><button id="check-wishlist" type="button">Wunschliste prüfen</button></div><button id="stop-search" type="button" class="secondary" hidden>Suche stoppen</button><div id="wishlist-items"></div><div id="wishlist-total" aria-live="polite"></div></section><p id="status" role="status"></p><h2>Suchergebnisse</h2><section id="results" aria-live="polite"><p class="empty">Welches Teil brauchst du?</p></section><p class="privacy-link"><a href="privacy.html" target="_blank">Datenschutz</a></p></main><script src="variant-match.js"></script><script src="wishlist.js"></script><script src="wishlist-file.js"></script><script src="home.js"></script></body></html>
