<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teilefinder</title><link rel="preload" href="fonts/InterVariable.woff2" as="font" type="font/woff2" crossorigin><link rel="stylesheet" href="home.css"><body><main><h1>Fahrradteile vergleichen</h1><form id="search"><label for="query">Produktname</label><div class="search-box"><input id="query" placeholder="z. B. Shimano CN-M8100" maxlength="160" required><button id="search-submit">Suchen</button></div><div class="filter"><div class="ean-heading"><label for="search-ean">EAN</label><input id="search-use-ean" class="ean-toggle" type="checkbox" role="switch" checked aria-label="EAN für die Ad-hoc-Suche verwenden" title="Zuerst EAN, sonst Produktname suchen"></div><input id="search-ean" placeholder="Wird automatisch ergänzt" inputmode="numeric" pattern="[0-9]{8,14}" maxlength="14"></div><div class="filter"><label for="search-variant">Variante</label><input id="search-variant" placeholder="z. B. 30 mm, 750 ml oder silber" maxlength="100"></div><div class="filter"><label for="max">Preis (€)</label><input id="max" type="text" placeholder="10 / 5–10" title="Maximalpreis oder Preisbereich"></div></form><div class="search-actions"><button id="add-wish" class="secondary" type="button">Zur Wunschliste hinzufügen</button> <button id="close-shop-tabs" class="secondary" type="button" title="Die von diesem Teilefinder-Tab geöffneten Shop-Tabs schließen">Shop-Tabs schließen</button></div><section class="wishlist"><div class="shop-heading"><h2><button id="wishlist-toggle" type="button" aria-expanded="true" aria-controls="wishlist-content"><span class="disclosure-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="m9 5 7 7-7 7"/></svg></span> Deine Wunschliste</button></h2><div class="wishlist-files"><button id="export-wishlist" type="button" class="secondary">Als Datei speichern</button><button id="import-wishlist" type="button" class="secondary">Datei laden</button><input id="wishlist-file" type="file" accept=".json,application/json" hidden></div><button id="check-wishlist" type="button">Wunschliste prüfen</button></div><div id="wishlist-content"><div id="wishlist-items"></div><div id="wishlist-total"></div><div id="wishlist-shop-results"></div></div></section><button id="stop-search" type="button" class="secondary" hidden>Suche stoppen</button><p class="search-status" role="status"><button id="status" type="button" disabled></button></p><h2 id="search-results-heading">Suchergebnisse</h2><section id="results"><p class="empty">Welches Teil brauchst du?</p></section><p class="privacy-link"><a href="privacy.html" target="_blank">Datenschutz</a></p></main><script src="variant-match.js"></script><script src="wishlist.js"></script><script src="wishlist-file.js"></script><script src="price-history.js"></script><script src="home.js"></script></body></html>
